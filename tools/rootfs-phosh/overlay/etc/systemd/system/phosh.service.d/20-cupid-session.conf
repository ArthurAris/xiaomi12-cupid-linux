# Override the installed Ubuntu Phosh development unit; keep its ExecStart/PAM/TTY.
[Unit]
Requires=user@1000.service systemd-logind.service
After=user@1000.service systemd-logind.service

[Service]
User=linux
Environment=HOME=/home/linux
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
Environment=LANG=C.UTF-8
Environment=WLR_BACKENDS=drm,libinput
Environment=WLR_NO_HARDWARE_CURSORS=1
Environment=LIBSEAT_BACKEND=logind
# Never race a TTY-opening ExecStartPost against the main PAM/TTY session.
ExecStartPre=
ExecStartPost=
# Synchronize with the real user manager, not a sleep or an assumed scope name.
ExecStartPre=+/usr/sbin/runuser -u linux -- /usr/bin/env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus /usr/bin/systemctl --user start dbus.socket
ExecStartPre=+/usr/bin/chvt 7
